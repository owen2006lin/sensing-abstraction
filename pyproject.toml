[project]
name = "sensing-abstraction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "owen2006lin", email = "owen2006lin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.7.0.99",
    "numpy>=2.5.2",
    "plotly>=7.0.0",
    "polars",
    "scikit-learn>=1.9.0",
]

[project.scripts]
sensing-abstraction = "sensing_abstraction:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
lightgbm = { path = "/home/owen-0g/LightGBM/dist/lightgbm-4.7.0.99-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
